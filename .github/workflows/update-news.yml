name: Update news

on:
  schedule:
    # Every 3 hours UTC
    - cron: "20 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - holdings.json
      - update_news.py

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch portfolio headlines
        run: python update_news.py

      - name: Commit news.json if changed
        run: |
          if git diff --quiet -- news.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash || true
          git push

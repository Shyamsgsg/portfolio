name: Update prices

on:
  schedule:
    # All times UTC. GitHub may start scheduled runs a few minutes late.
    # US market hours (NYSE/NASDAQ 9:30-16:00 ET => ~13:30-21:00 UTC), every 30 min, Mon-Fri
    - cron: "*/30 13-21 * * 1-5"
    # ASX hours (10:00-16:00 Sydney => ~23:00-06:00 UTC), every 30 min, Mon-Fri Sydney time
    - cron: "*/30 23 * * 0-4"
    - cron: "*/30 0-6 * * 1-5"
    # Weekend safety net: once a day
    - cron: "15 12 * * 0,6"
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - holdings.json

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest prices
        run: python update_prices.py

      - name: Commit prices.json if changed
        run: |
          if git diff --quiet -- prices.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash || true
          git push

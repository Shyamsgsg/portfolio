<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#FBF8F1" />
  <title>Surabhi Industries</title>
  <link rel="icon" href="/media/emblem-s.svg" type="image/svg+xml" />
  <link rel="icon" href="/media/favicon.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root{--gold:#C9A24B;--gold-d:#8F6E28;--ink:#2a2a28;--muted:#8a8378;--cream:#FBF8F1}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
      background:radial-gradient(ellipse at 50% 38%,#FFFFFF 0%,var(--cream) 62%,#F5EFE2 100%);
      color:var(--ink);font-family:Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;text-align:center;
    }
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px}
    .mark{width:88px;height:88px;margin-bottom:34px;opacity:0;animation:rise 1.4s ease .1s forwards}
    h1{
      font-family:Cinzel,"Times New Roman",serif;font-weight:600;
      font-size:clamp(26px,5.2vw,44px);letter-spacing:.16em;text-transform:uppercase;
      color:var(--ink);line-height:1.15;padding-left:.16em;
      opacity:0;animation:rise 1.4s ease .35s forwards;
    }
    .rule{
      width:64px;height:1px;margin:28px auto 26px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
      opacity:0;animation:fade 1.6s ease .7s forwards;
    }
    .status{
      font-family:Cinzel,"Times New Roman",serif;font-weight:400;
      font-size:clamp(13px,2.4vw,16px);letter-spacing:.32em;text-transform:uppercase;
      color:var(--gold-d);padding-left:.32em;
      opacity:0;animation:fade 1.6s ease .9s forwards;
    }
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes fade{to{opacity:1}}
    @media (max-width:480px){
      .mark{width:72px;height:72px;margin-bottom:28px}
      h1{letter-spacing:.12em;padding-left:.12em}
      .status{letter-spacing:.24em;padding-left:.24em}
    }
    @media (prefers-reduced-motion:reduce){.mark,h1,.rule,.status{animation:none;opacity:1}}
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Surabhi Industries monogram">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E0C36A"/>
          <stop offset="45%" stop-color="#C9A24B"/>
          <stop offset="100%" stop-color="#8F6E28"/>
        </linearGradient>
      </defs>
      <rect x="3.5" y="3.5" width="57" height="57" rx="10" fill="none" stroke="url(#g)" stroke-width="1.4"/>
      <rect x="8" y="8" width="48" height="48" rx="7" fill="none" stroke="url(#g)" stroke-width="0.6" opacity="0.55"/>
      <text x="32" y="43" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="url(#g)">S</text>
    </svg>
    <h1>Surabhi Industries</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="status">Website under development</p>
  </main>
</body>
</html>
